<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boulder Scout · area</title>
    <style>
      :root {
        --ink: #1f2933; --muted: #616e7c; --line: #d9dee3; --panel: #fffffff2;
        --accent: #2f6f4f; --accent-ink: #fff;
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
      }
      html, body { height: 100%; margin: 0; }
      #app { position: absolute; inset: 0; }
      #panel {
        position: absolute; top: 10px; left: 10px; z-index: 1; padding: 10px 12px; max-width: 320px;
        background: var(--panel); border-radius: 8px; box-shadow: 0 1px 4px #0003;
      }
      #panel h1 { margin: 0 0 4px; font-size: 15px; }
      #summary { margin: 0 0 2px; }
      #hint { margin: 0 0 8px; color: var(--muted); }
      #status { margin: 6px 0 0; color: var(--muted); }
      .key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 3px 0 8px; }
      button {
        font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line);
        border-radius: 6px; padding: 4px 10px; cursor: pointer;
      }
      button:hover { background: #f1f4f6; }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      button.primary:hover { background: #255a40; }
      button:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel">
      <h1>Area for run_area.py</h1>
      <p id="summary"></p>
      <p id="hint"></p>
      <button id="undo">Undo</button>
      <button id="clear">Clear</button>
      <button id="save" class="primary">Save area</button>
      <p id="status"></p>
      <p id="key" style="color: var(--muted); margin: 6px 0 0">
        Tiles:<span class="key" style="background: #e8833a"></span>new<span class="key" style="background: #2f9e5f"></span>run already
      </p>
    </div>
    <script type="module" src="/src/area.ts"></script>
  </body>
</html>
